<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">C4 — visão de containers da Plataforma de Jogo Multiplayer</title><desc id="desc">Jogador usa a Plataforma do Jogo, que usa provedor externo de identidade e contém containers de cliente, matchmaking e servidores de partida.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#344054"/></marker><style>.bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:20}.inside{fill:#fff;stroke:#475467;stroke-width:2;rx:12}.actor{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:50}.ext{fill:#fef2f2;stroke:#b91c1c;stroke-width:2;rx:14}.title{font:700 31px system-ui,sans-serif;fill:#101828;text-anchor:middle}.sub{font:17px system-ui,sans-serif;fill:#475467;text-anchor:middle}.name{font:700 19px system-ui,sans-serif;fill:#101828;text-anchor:middle}.small{font:15px system-ui,sans-serif;fill:#475467;text-anchor:middle}.line{fill:none;stroke:#344054;stroke-width:2.5;marker-end:url(#arrow)}.label{font:14px system-ui,sans-serif;fill:#344054;text-anchor:middle}</style></defs><rect class="bg" width="1500" height="850"/><text class="title" x="750" y="55">C4 · Container View — Plataforma de Jogo Multiplayer</text><text class="sub" x="750" y="88">Fronteira do sistema, containers e relações externas</text>
<rect class="actor" x="55" y="315" width="230" height="150"/><text class="name" x="170" y="375">Jogador</text><text class="small" x="170" y="407">entra em partidas</text><text class="small" x="170" y="432">envia inputs · recebe estado</text>
<rect class="box" x="370" y="145" width="800" height="550"/><text class="name" x="770" y="190">Sistema: Plataforma do Jogo</text><text class="small" x="770" y="220">gerencia identidade, filas e sessões multiplayer</text>
<rect class="inside" x="425" y="280" width="300" height="145"/><text class="name" x="575" y="330">Cliente do Jogo</text><text class="small" x="575" y="361">interface · renderização · inputs</text><text class="small" x="575" y="386">conecta-se à sessão alocada</text>
<rect class="inside" x="805" y="280" width="300" height="145"/><text class="name" x="955" y="330">Matchmaking</text><text class="small" x="955" y="361">forma partidas · escolhe região</text><text class="small" x="955" y="386">admite jogadores conforme capacidade</text>
<rect class="inside" x="615" y="495" width="350" height="145"/><text class="name" x="790" y="545">Servidor de Partida</text><text class="small" x="790" y="576">autoridade do estado · valida inputs</text><text class="small" x="790" y="601">sincroniza sessão em tempo real</text>
<rect class="ext" x="1220" y="315" width="230" height="150"/><text class="name" x="1335" y="375">Provedor de</text><text class="name" x="1335" y="400">Identidade</text><text class="small" x="1335" y="433">autentica contas</text>
<path class="line" d="M285 360H425"/><text class="label" x="350" y="345">HTTPS / entrada no jogo</text>
<path class="line" d="M725 340H805"/><text class="label" x="765" y="325">HTTPS / fila</text>
<path class="line" d="M955 425C930 470 890 480 850 495"/><text class="label" x="1030" y="463">aloca sessão</text>
<path class="line" d="M665 425V495"/><text class="label" x="560" y="465">inputs / comandos</text>
<path class="line" d="M710 495V425"/><text class="label" x="790" y="465">estado atualizado</text>
<path class="line" d="M1105 390H1220"/><text class="label" x="1162" y="375">OIDC / OAuth 2.0</text>
<text class="sub" x="750" y="775">Protocolos ilustrativos. Conteúdo conceitual: não representa infraestrutura real de um produto existente.</text></svg>
