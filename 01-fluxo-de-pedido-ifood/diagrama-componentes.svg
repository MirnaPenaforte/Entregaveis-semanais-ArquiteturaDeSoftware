<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">Diagrama UML de componentes — fluxo de pedido de comida</title>
<desc id="desc">Proposta acadêmica: App Cliente comunica com Load Balancer e API Gateway; serviços de catálogo, pedidos, pagamentos e notificações acessam os componentes necessários. Banco primário replica para banco de standby.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#344054"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
  <style>
    .bg{fill:#f8fafc}.title{font:700 30px system-ui,sans-serif;fill:#101828}.subtitle{font:16px system-ui,sans-serif;fill:#475467}.comp{fill:#fff;stroke:#334155;stroke-width:2;rx:12}.infra{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.db{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:12}.external{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.name{font:700 17px system-ui,sans-serif;fill:#101828;text-anchor:middle}.detail{font:14px system-ui,sans-serif;fill:#475467;text-anchor:middle}.line{stroke:#344054;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.data{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#arrowBlue)}.rep{stroke:#15803d;stroke-width:2.4;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}.label{font:13px system-ui,sans-serif;fill:#344054}.badge{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}.badgeText{font:12px system-ui,sans-serif;fill:#1d4ed8;text-anchor:middle;font-weight:700}.legend{font:13px system-ui,sans-serif;fill:#344054}
  </style>
</defs>
<rect class="bg" width="1600" height="1020"/>
<text class="title" x="800" y="52" text-anchor="middle">Fluxo de pedido — diagrama UML de componentes</text>
<text class="subtitle" x="800" y="82" text-anchor="middle">Proposta didática de alto nível · não representa a arquitetura interna oficial do iFood</text>
<!-- Consumer and edge -->
<rect class="comp" x="55" y="390" width="210" height="118"/>
<path d="M75 410h22v7H75z M75 421h22v7H75z M75 432h22v7H75z" fill="#2563eb"/>
<text class="name" x="160" y="449">App Cliente</text><text class="detail" x="160" y="474">consulta · pedido · status</text>
<rect class="infra" x="340" y="390" width="210" height="118"/>
<path d="M360 412h24v5h-24z M360 422h24v5h-24z M360 432h24v5h-24z" fill="#2563eb"/>
<text class="name" x="445" y="449">Load Balancer</text><text class="detail" x="445" y="474">distribui requisições</text>
<rect class="infra" x="625" y="350" width="250" height="198"/>
<rect class="badge" x="644" y="365" width="60" height="23" rx="11"/><text class="badgeText" x="674" y="381">2 inst.</text>
<path d="M650 410h22v7h-22z M650 421h22v7h-22z M650 432h22v7h-22z" fill="#2563eb"/>
<text class="name" x="750" y="453">API Gateway</text><text class="detail" x="750" y="480">roteamento · entrada HTTP</text>
<!-- Services -->
<rect class="comp" x="1010" y="135" width="245" height="125"/>
<path d="M1030 156h22v7h-22z M1030 167h22v7h-22z M1030 178h22v7h-22z" fill="#2563eb"/>
<text class="name" x="1132" y="197">Serviço de Catálogo</text><text class="detail" x="1132" y="222">restaurantes · cardápios</text>
<rect class="comp" x="1010" y="345" width="245" height="125"/>
<path d="M1030 366h22v7h-22z M1030 377h22v7h-22z M1030 388h22v7h-22z" fill="#2563eb"/>
<text class="name" x="1132" y="407">Serviço de Pedidos</text><text class="detail" x="1132" y="432">valida · registra · atualiza</text>
<rect class="comp" x="1010" y="565" width="245" height="125"/>
<path d="M1030 586h22v7h-22z M1030 597h22v7h-22z M1030 608h22v7h-22z" fill="#2563eb"/>
<text class="name" x="1132" y="627">Serviço de Pagamentos</text><text class="detail" x="1132" y="652">processa autorização</text>
<rect class="comp" x="1010" y="795" width="245" height="125"/>
<path d="M1030 816h22v7h-22z M1030 827h22v7h-22z M1030 838h22v7h-22z" fill="#2563eb"/>
<text class="name" x="1132" y="857">Serviço de Notificações</text><text class="detail" x="1132" y="882">atualiza o cliente</text>
<!-- Infra and external -->
<rect class="infra" x="1360" y="150" width="195" height="105"/>
<text class="name" x="1457" y="190">Cache Redis</text><text class="detail" x="1457" y="215">leituras frequentes</text>
<rect class="external" x="1360" y="575" width="195" height="105"/>
<text class="name" x="1457" y="615">Provedor externo</text><text class="detail" x="1457" y="640">de pagamento</text>
<rect class="db" x="1360" y="345" width="195" height="125"/>
<text class="name" x="1457" y="390">Banco de Pedidos</text><text class="detail" x="1457" y="416">primário · gravação</text>
<rect class="db" x="1360" y="795" width="195" height="125"/>
<text class="name" x="1457" y="840">Banco de Pedidos</text><text class="detail" x="1457" y="866">réplica · standby</text>
<!-- Connections -->
<path class="line" d="M265 449H340"/><text class="label" x="268" y="436">HTTPS</text>
<path class="line" d="M550 449H625"/><text class="label" x="560" y="436">HTTP</text>
<path class="line" d="M875 390 C930 390 945 197 1010 197"/><text class="label" x="895" y="280">consulta</text>
<path class="line" d="M875 449H1010"/><text class="label" x="898" y="437">cria/consulta</text>
<path class="line" d="M875 500 C940 500 950 857 1010 857"/><text class="label" x="893" y="700">status</text>
<path class="data" d="M1255 197H1360"/><text class="label" x="1270" y="185">consulta cache</text>
<path class="data" d="M1360 230 C1315 290 1290 240 1255 230"/><text class="label" x="1262" y="267">retorno/cache</text>
<path class="data" d="M1255 405H1360"/><text class="label" x="1270" y="393">grava/consulta</text>
<path class="line" d="M1132 470V565"/><text class="label" x="1142" y="524">solicita cobrança</text>
<path class="line" d="M1255 627H1360"/><text class="label" x="1262" y="615">API segura</text>
<path class="line" d="M1360 650 C1310 680 1290 650 1255 650"/><text class="label" x="1266" y="678">resultado</text>
<path class="rep" d="M1457 470V795"/><text class="label" x="1469" y="746">replicação</text>
<path class="line" d="M1010 875 C740 950 440 700 265 490"/><text class="label" x="570" y="832">push / atualização de status</text>
<!-- Legend -->
<line x1="55" y1="970" x2="115" y2="970" class="line"/><text class="legend" x="125" y="975">chamada / dependência</text>
<line x1="330" y1="970" x2="390" y2="970" class="rep"/><text class="legend" x="400" y="975">replicação de dados</text>
<text class="legend" x="800" y="975" text-anchor="middle">Retângulos representam componentes; itens em azul indicam infraestrutura/escala.</text>
</svg>
